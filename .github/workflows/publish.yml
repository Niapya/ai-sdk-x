name: Publish Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check published version
        id: published
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/ai-sdk-x/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./packages/ai-sdk-x/package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.published.outputs.published == 'false'
        run: bun run build

      - name: Publish package
        if: steps.published.outputs.published == 'false'
        run: npm publish --provenance --access public
        working-directory: packages/ai-sdk-x
